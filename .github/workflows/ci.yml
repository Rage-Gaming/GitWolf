name: CI

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the code.
permissions:
  contents: read

jobs:
  macos:
    # macos-15 is what releases are built on (an older Swift than latest), so both must pass.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    # A hung test fails here in minutes instead of at GitHub's 6 hour limit.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test tests/GitWolfCore.Tests/GitWolfCore.Tests.csproj --nologo --blame-hang-timeout 5m
      - name: Build release tool
        run: dotnet build tools/GitWolf.Release/GitWolf.Release.csproj --nologo
      # The WinUI app needs the MSBuild that ships with Visual Studio.
      - name: Build app
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild was not found' }
          & $msbuild src\GitWolf.App\GitWolf.App.csproj -restore -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -v:minimal -nologo
